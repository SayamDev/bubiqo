<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Diagram of the Chrome toolbar: press the puzzle-piece Extensions button, then press the pin beside Bubiqo, and its icon joins the toolbar">
  <rect width="1000" height="330" fill="#f6f1e6"/>

  <!-- Toolbar -->
  <rect x="40" y="30" width="920" height="62" rx="14" fill="#f1ece1" stroke="#dbcfb9" stroke-width="2"/>
  <circle cx="74" cy="61" r="6" fill="#cfc2aa"/><circle cx="94" cy="61" r="6" fill="#cfc2aa"/><circle cx="114" cy="61" r="6" fill="#cfc2aa"/>
  <rect x="146" y="47" width="516" height="28" rx="14" fill="#ffffff" stroke="#e4dac6"/>
  <text x="164" y="66" font-family="Inter, sans-serif" font-size="14" fill="#a99c88">uk.indeed.com/viewjob…</text>

  <!-- Puzzle piece: step 5 -->
  <g>
    <rect x="726" y="42" width="38" height="38" rx="11" fill="#ffffff" stroke="#dbcfb9"/>
    <path d="M737 62v-7a3 3 0 0 1 3-3h2a3 3 0 1 1 6 0h2a3 3 0 0 1 3 3v2a3 3 0 1 1 0 6v2a3 3 0 0 1-3 3h-7" fill="none" stroke="#5d5346" stroke-width="2" stroke-linejoin="round"/>
    <rect x="718" y="34" width="54" height="54" rx="16" fill="none" stroke="#a81f42" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle cx="694" cy="61" r="15" fill="#a81f42"/>
    <text x="694" y="67" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">5</text>
  </g>

  <!-- The Bubiqo icon, once pinned -->
  <g>
    <rect x="782" y="42" width="38" height="38" rx="11" fill="#241f18"/>
    <circle cx="801" cy="63" r="10" fill="none" stroke="#fdfaf4" stroke-width="3"/>
    <circle cx="810" cy="52" r="4.5" fill="#e08a1e"/>
    <circle cx="866" cy="61" r="15" fill="#0d6551"/>
    <text x="866" y="67" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">7</text>
    <text x="890" y="66" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0d6551">Click it</text>
  </g>

  <!-- The extensions menu: step 6 -->
  <g>
    <rect x="596" y="106" width="330" height="176" rx="16" fill="#ffffff" stroke="#dbcfb9" stroke-width="2"/>
    <text x="622" y="140" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#241f18">Extensions</text>

    <rect x="614" y="156" width="294" height="52" rx="12" fill="#faf6ee"/>
    <rect x="628" y="168" width="28" height="28" rx="9" fill="#241f18"/>
    <circle cx="642" cy="183" r="7" fill="none" stroke="#fdfaf4" stroke-width="2.4"/>
    <circle cx="648" cy="175" r="3.4" fill="#e08a1e"/>
    <text x="668" y="188" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#241f18">Bubiqo</text>

    <!-- The pin -->
    <g transform="translate(866 170)">
      <path d="M8 2h8l-1.6 7.2L18 12v2h-5v7l-1 2-1-2v-7H6v-2l3.6-2.8Z" fill="#9d5406"/>
    </g>
    <rect x="852" y="160" width="44" height="44" rx="13" fill="none" stroke="#a81f42" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle cx="838" cy="238" r="15" fill="#a81f42"/>
    <text x="838" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">6</text>
    <text x="622" y="244" font-family="Inter, sans-serif" font-size="13.5" fill="#5d5346">Press the pin so the icon stays</text>
    <text x="622" y="264" font-family="Inter, sans-serif" font-size="13.5" fill="#5d5346">on the toolbar.</text>
  </g>
</svg>
