<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Bubiqo — reads the page you are on and tells you what it actually says">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf4"/>
      <stop offset="100%" stop-color="#f6f1e6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9d5406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9d5406" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ground)"/>

  <!-- The radar, the same mark the panel draws in its corner. -->
  <g transform="translate(1092 300)" fill="none" stroke="#9d5406" stroke-width="1.4">
    <circle r="58" stroke-opacity="0.30"/>
    <circle r="112" stroke-opacity="0.22"/>
    <circle r="170" stroke-opacity="0.15"/>
    <circle r="234" stroke-opacity="0.09"/>
    <circle r="304" stroke-opacity="0.05"/>
  </g>
  <path d="M1092 300 L1092 60 A240 240 0 0 1 1294 172 Z" fill="url(#sweep)"/>
  <circle cx="1210" cy="228" r="13" fill="#9d5406"/>
  <circle cx="982" cy="410" r="9" fill="#a81f42" fill-opacity="0.7"/>
  <circle cx="1146" cy="478" r="7" fill="#0d6551" fill-opacity="0.55"/>

  <!-- The mark: ink tile, honey dot. -->
  <g transform="translate(104 150)">
    <rect width="104" height="104" rx="30" fill="#241f18"/>
    <circle cx="52" cy="56" r="26" fill="none" stroke="#fdfaf4" stroke-width="7"/>
    <circle cx="76" cy="30" r="11" fill="#e08a1e"/>
  </g>

  <text x="234" y="230" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#241f18">bubiqo</text>
  <circle cx="512" cy="220" r="13" fill="#9d5406"/>

  <text x="106" y="330" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#5d5346">Reads the page you are on, and tells you what it</text>
  <text x="106" y="382" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#5d5346">actually says — without sending it anywhere.</text>

  <!-- What it pulls off a job advert, as the panel shows it. -->
  <g transform="translate(106 452)" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect width="176" height="86" rx="18" fill="#ffffff" stroke="#ece4d6" stroke-width="2"/>
      <text x="20" y="34" font-size="17" font-weight="800" letter-spacing="1.4" fill="#796e60">PAY</text>
      <text x="20" y="64" font-size="24" font-weight="700" fill="#241f18">£35–40k</text>
    </g>
    <g transform="translate(196 0)">
      <rect width="196" height="86" rx="18" fill="#ffffff" stroke="#ece4d6" stroke-width="2"/>
      <text x="20" y="34" font-size="17" font-weight="800" letter-spacing="1.4" fill="#796e60">CLOSES</text>
      <text x="20" y="64" font-size="24" font-weight="700" fill="#241f18">10 Jan 2027</text>
    </g>
    <g transform="translate(412 0)">
      <rect width="300" height="86" rx="18" fill="#ffe5eb"/>
      <circle cx="42" cy="43" r="13" fill="none" stroke="#a81f42" stroke-width="3"/>
      <path d="M35 43h14" stroke="#a81f42" stroke-width="3" stroke-linecap="round"/>
      <text x="68" y="36" font-size="17" font-weight="800" letter-spacing="1.2" fill="#a81f42">ONE CONDITION</text>
      <text x="68" y="64" font-size="21" font-weight="600" fill="#a81f42">DBS check required</text>
    </g>
  </g>
</svg>
