<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Diagram of the Chrome extensions page: Developer mode is turned on at the top right, then Load unpacked appears at the top left">
  <rect width="1000" height="470" fill="#f6f1e6"/>

  <!-- The browser frame -->
  <rect x="40" y="34" width="920" height="400" rx="14" fill="#ffffff" stroke="#dbcfb9" stroke-width="2"/>
  <rect x="40" y="34" width="920" height="54" rx="14" fill="#f1ece1"/>
  <rect x="40" y="74" width="920" height="14" fill="#f1ece1"/>
  <circle cx="70" cy="61" r="6" fill="#dbcfb9"/><circle cx="90" cy="61" r="6" fill="#dbcfb9"/><circle cx="110" cy="61" r="6" fill="#dbcfb9"/>
  <rect x="136" y="48" width="300" height="26" rx="13" fill="#ffffff" stroke="#e4dac6"/>
  <text x="152" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5d5346">chrome://extensions</text>

  <!-- Page header row -->
  <text x="72" y="128" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241f18">Extensions</text>

  <!-- Developer mode toggle, step 2 -->
  <g>
    <text x="742" y="127" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#241f18">Developer mode</text>
    <rect x="872" y="112" width="44" height="24" rx="12" fill="#9d5406"/>
    <circle cx="904" cy="124" r="9" fill="#ffffff"/>
    <rect x="726" y="100" width="204" height="48" rx="14" fill="none" stroke="#a81f42" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle cx="712" cy="124" r="15" fill="#a81f42"/>
    <text x="712" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
  </g>

  <!-- Load unpacked row, step 3 -->
  <g>
    <rect x="72" y="168" width="856" height="62" rx="12" fill="#faf6ee" stroke="#ece4d6"/>
    <rect x="92" y="185" width="150" height="30" rx="15" fill="#ffffff" stroke="#dbcfb9"/>
    <text x="112" y="205" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241f18">Load unpacked</text>
    <rect x="256" y="185" width="120" height="30" rx="15" fill="#ffffff" stroke="#ece4d6"/>
    <text x="276" y="205" font-family="Inter, sans-serif" font-size="14" fill="#a99c88">Pack extension</text>
    <rect x="80" y="176" width="176" height="48" rx="14" fill="none" stroke="#a81f42" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle cx="66" cy="200" r="15" fill="#a81f42"/>
    <text x="66" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">3</text>
  </g>

  <!-- The installed card, step 5 -->
  <g>
    <rect x="72" y="256" width="420" height="140" rx="14" fill="#ffffff" stroke="#ece4d6"/>
    <rect x="96" y="282" width="44" height="44" rx="14" fill="#241f18"/>
    <circle cx="118" cy="305" r="11" fill="none" stroke="#fdfaf4" stroke-width="3"/>
    <circle cx="128" cy="294" r="5" fill="#e08a1e"/>
    <text x="158" y="298" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#241f18">Bubiqo</text>
    <text x="158" y="320" font-family="Inter, sans-serif" font-size="13" fill="#796e60">0.1.0</text>
    <text x="96" y="360" font-family="Inter, sans-serif" font-size="13" fill="#796e60">Reads the page you have open and pulls out</text>
    <text x="96" y="378" font-family="Inter, sans-serif" font-size="13" fill="#796e60">the parts that matter.</text>
    <rect x="404" y="356" width="44" height="24" rx="12" fill="#0d6551"/>
    <circle cx="436" cy="368" r="9" fill="#ffffff"/>
    <circle cx="516" cy="326" r="15" fill="#0d6551"/>
    <text x="516" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">5</text>
    <text x="540" y="320" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#241f18">It appears here, switched on.</text>
    <text x="540" y="344" font-family="Inter, sans-serif" font-size="14" fill="#5d5346">Pin it, then open it on any page with</text>
    <text x="540" y="364" font-family="Inter, sans-serif" font-size="14" fill="#5d5346">⌘⇧A — or right-click a selection and</text>
    <text x="540" y="384" font-family="Inter, sans-serif" font-size="14" fill="#5d5346">choose “Read this with Bubiqo”.</text>
  </g>
</svg>
