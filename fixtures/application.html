<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply — Senior Frontend Engineer</title><link rel="stylesheet" href="_style.css">
</head>
<body>
<nav><div class="wrap"><strong>Careers</strong><a href="index.html">All demo pages</a></div></nav>
<div class="wrap">
  <main class="card">
    <h1>Application form</h1>
    <p class="meta">Complete all required fields and submit before the closing date of <span data-in-days="19"></span>.</p>

    <form>
      <label for="name">Full name (required)</label>
      <input id="name" name="name" required value="Sayam Ajmal">

      <label for="email">Email address (required)</label>
      <input id="email" name="email" type="email" required value="sayam@example.com">

      <label for="cover">Cover letter (required)</label>
      <textarea id="cover" name="cover" rows="5" required placeholder="Tell us why you're a fit"></textarea>

      <label for="portfolio">Portfolio URL</label>
      <input id="portfolio" name="portfolio" type="url" placeholder="https://">
    </form>

    <div class="tip">
      One required field is empty. Bubiqo notices a form that was started and not
      finished — a form never begun is not forgotten work, so it stays quiet about those.
    </div>
  </main>
</div>
<script src="demo-dates.js"></script>
</body>
</html>
